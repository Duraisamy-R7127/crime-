version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: crimevision_user
      POSTGRES_PASSWORD: crimevision_password
      POSTGRES_DB: crimevision_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://crimevision_user:crimevision_password@db/crimevision_db
      - SECRET_KEY=supersecretkey_crimevision
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  pgdata:
